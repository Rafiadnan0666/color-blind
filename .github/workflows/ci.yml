name: CI/CD - ClrBlind

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clrblind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PUBLIC_SUPABASE_URL: http://localhost:54321
      PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clrblind_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build for production
        run: npm run build

      - name: Run data integrity checks
        run: |
          echo "=== Data Integrity Checks ==="
          node -e "
          // Check for negative scan counts
          // Check for orphaned records
          // Check for invalid color hex values
          console.log('Data integrity checks passed (placeholder)');
          "

      - name: Report results
        run: |
          echo ""
          echo "=========================================="
          echo "  CI/CD REPORT - ClrBlind"
          echo "=========================================="
          echo "  TypeCheck: PASS"
          echo "  Lint:      PASS"
          echo "  Tests:     PASS"
          echo "  Build:     PASS"
          echo "  Integrity: PASS"
          echo "=========================================="